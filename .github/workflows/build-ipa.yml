name: Build & Publish IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.1.1)
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (iOS, AltStore profile)
        run: |
          eas build --platform ios --profile altstore --non-interactive --wait \
            --output ./WelmiKiller.ipa

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./WelmiKiller.ipa
          tag_name: ${{ github.ref_name || inputs.version }}

      - name: Update AltStore manifest in data repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DATA_REPO }}
          VERSION: ${{ github.ref_name || inputs.version }}
        run: node scripts/update-manifest.mjs "$VERSION"
